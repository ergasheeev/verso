<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" width="132" height="32" role="img" aria-label="Verso">
  <!-- Wordmark for dark surfaces: bone letterforms, gold mark.
       The type is set in a system serif rather than Fraunces because an SVG
       referenced through <img> is an isolated document — it cannot reach the
       page's webfonts, so a Fraunces reference here would silently fall back
       to whatever the UA picked. In-app the React <Wordmark> component sets
       real Fraunces; this file is for the favicon, OG chrome and any
       <img>-based call site. -->
  <path d="M13.6 9.6 L2.8 6.9 V24.9 L13.6 27.6 Z" fill="#E0A94E"/>
  <path d="M15.4 9.6 L26.2 6.9 V24.9 L15.4 27.6 Z" fill="none" stroke="#E0A94E" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="38" y="22.4"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18.5" font-weight="400" letter-spacing="3.6"
        fill="#F5EFE3">VERSO</text>
</svg>
