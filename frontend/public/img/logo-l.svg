  <path d="M15.4 9.6 L26.2 6.9 V24.9 L15.4 27.6 Z" fill="none" stroke="#8A6224" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="38" y="22.4"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18.5" font-weight="400" letter-spacing="3.6"
        fill="#16191F">VERSO</text>
</svg>
